function createPendingDelivery(car){

function reconcilePendingDelivery(){
  if(!state.pendingDelivery||!state.pendingDelivery.car)return false;
  const p=state.pendingDelivery,now=Date.now();
  if(!Number.isFinite(Number(p.startedAt))||Number(p.startedAt)<=0)p.startedAt=now;

  if(Number(p.endAt)<=now){

  return false;

function tickDelivery(){
  if(!state.pendingDelivery){clearDeliveryTimer();return;}
  if(reconcilePendingDelivery())return;

  const timerEl=document.querySelector('#garageCards .pendingCard:not(.breakdown) .roadTimer');

      if(typeof state!=='undefined'&&state?.pendingDelivery?.car){
        reconcilePendingDelivery();
        if(state.pendingDelivery){startDelivery();try{save();}catch(e){}}
        else {try{save();render();}catch(e){}}
      }
    }catch(e){}}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else setTimeout(boot,0);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{if(typeof state!=='undefined'&&state?.pendingDelivery?.car)startDelivery();}catch(e){}}});
  }catch(e){}})();<\/script>`;
  source=source.replace(/<\/body>/i,hook+'</body>');
  return source;
}

(function(){
  'use strict';
  if(window.__PEREKUP_GARAGE_REPAINT_PATCH)return;
  window.__PEREKUP_GARAGE_REPAINT_PATCH=true;
  function refreshOpenGarageModal(i){
    try{
      const modal=document.getElementById('modal');
      if(!modal || !modal.classList.contains('show'))return;
      const fn=window.__PEREKUP_GARAGE_INSPECT;
      if(typeof fn==='function') setTimeout(()=>{try{fn(Number(i))}catch(e){}},0);
    }catch(e){}
  }
  function wrap(name){
    try{
      if(typeof window[name]!=='function' || window[name].__garageRefreshWrapped)return;
      const original=window[name];
      function wrapped(i){const r=original.apply(this,arguments);refreshOpenGarageModal(i);return r}
      wrapped.__garageRefreshWrapped=true;
      window[name]=wrapped;
    }catch(e){}
  }
  function boot(){wrap('issueRepair');wrap('repair');}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else setTimeout(boot,50);
  setTimeout(boot,200);
})();
